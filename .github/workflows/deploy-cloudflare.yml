name: Deploy Oinki Gay Events to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'gay-events.ics'
      - 'gay-cruises.inc'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare combined Pages calendar
        run: |
          mkdir -p dist
          awk '!/^END:VCALENDAR\r?$/' gay-events.ics > dist/gay-events.ics
          cat gay-cruises.inc >> dist/gay-events.ics
          printf 'END:VCALENDAR\r\n' >> dist/gay-events.ics
          echo "Published VEVENT count: $(grep -c '^BEGIN:VEVENT' dist/gay-events.ics)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=oinki-gay-events --branch=main
